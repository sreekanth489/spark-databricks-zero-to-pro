# =============================================================================
# DLT / Lakeflow Pipeline Definitions
#
# COMPUTE: Serverless — no clusters section required.
#   Databricks DLT automatically uses serverless when no cluster is specified
#   and the workspace enforces serverless compute.
#
# This DLT pipeline is the streaming alternative to the notebook-based
# silver transformation in jobs.yml. In a real project you would use one or
# the other, not both. Both are included here for teaching purposes.
#
# Deploy:  databricks bundle deploy --target dev
# Run:     databricks bundle run orders_dlt_pipeline --target dev
# =============================================================================

resources:
  pipelines:

    # -------------------------------------------------------------------------
    # DLT Pipeline: Orders Silver Layer
    #
    # Reads from the bronze Delta table (written by the ingest_bronze job task),
    # applies data quality expectations, and materialises two silver tables:
    #   - silver_orders_validated  (all valid orders)
    #   - silver_orders_delivered  (revenue-generating orders only)
    # -------------------------------------------------------------------------
    orders_dlt_pipeline:

      name: "orders-dlt-silver-${bundle.target}"
      description: >
        DLT pipeline that processes bronze orders into a validated silver layer
        with data quality checks. Runs on serverless compute.

      # Source notebook containing the @dlt.table decorator definitions
      libraries:
        - notebook:
            path: ../src/dlt_silver_pipeline.py

      # Configuration key-value pairs passed to the DLT runtime.
      # Access inside the notebook with: spark.conf.get("pipelines.<key>")
      configuration:
        catalog:                      ${var.catalog}
        schema:                       ${var.schema}
        environment:                  ${bundle.target}
        pipelines.enableTrackHistory: "true"

      # DLT publishes live tables to this catalog and schema
      catalog: ${var.catalog}
      target:  ${var.schema}

      # triggered: runs on-demand or on a schedule
      # continuous: always-on streaming
      continuous: false

      # development: true  → DLT dev mode (no quarantine, faster iteration)
      # development: false → production mode (full expectation enforcement)
      # ${bundle.is_development} is automatically true when mode: development
      # is set on the target (i.e., the dev target), false for staging/prod.
      development: ${bundle.is_development}

      # DLT release channel
      channel: ${var.dlt_channel}

      # Uncomment and update group names once your workspace groups are set up.
      # permissions:
      #   - level: CAN_RUN
      #     group_name: data-engineers
      #   - level: CAN_VIEW
      #     group_name: data-analysts
