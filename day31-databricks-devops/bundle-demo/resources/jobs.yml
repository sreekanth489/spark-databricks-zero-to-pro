# =============================================================================
# Job Definitions
#
# COMPUTE: Serverless — no cluster config required.
#   Tasks that specify no cluster automatically run on serverless compute.
#   This is the correct approach for workspaces that enforce serverless.
#
# ENVIRONMENT ISOLATION: achieved through ${var.catalog} and ${var.schema}.
#   dev     → main.ecommerce_dev
#   staging → main.ecommerce_staging
#   prod    → main.ecommerce_prod
#
# Deploy:  databricks bundle deploy --target dev
# Run:     databricks bundle run ecommerce_medallion_pipeline --target dev
# Run one task only: databricks bundle run ecommerce_medallion_pipeline \
#                      --target dev --task ingest_bronze
# =============================================================================

resources:
  jobs:

    # -------------------------------------------------------------------------
    # Medallion Pipeline Job
    #
    # Task DAG:   ingest_bronze  →  transform_silver  →  compute_gold
    #
    # Each task passes catalog, schema, and environment as notebook parameters
    # so the same notebook code works across all three environments.
    # -------------------------------------------------------------------------
    ecommerce_medallion_pipeline:

      name: "ecommerce-medallion-${bundle.target}"
      description: >
        End-to-end medallion pipeline (Bronze → Silver → Gold).
        Runs on serverless compute. Environment-specific catalog and
        schema are injected via bundle variables at deploy time.

      # ── Tasks ──────────────────────────────────────────────────────────────
      # No cluster config on any task = serverless compute (workspace default).

      tasks:

        # Task 1: Bronze — raw ingestion
        - task_key: ingest_bronze
          description: "Generate synthetic orders and write bronze Delta table"
          notebook_task:
            notebook_path: ../src/bronze_ingestion.py
            base_parameters:
              catalog:     ${var.catalog}
              schema:      ${var.schema}
              environment: ${bundle.target}
          timeout_seconds: 1800
          retry_on_timeout: false

        # Task 2: Silver — clean and enrich
        - task_key: transform_silver
          description: "Read bronze, apply quality rules, write silver"
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../src/silver_transform.py
            base_parameters:
              catalog:     ${var.catalog}
              schema:      ${var.schema}
              environment: ${bundle.target}
          timeout_seconds: 1800

        # Task 3: Gold — aggregate for BI
        - task_key: compute_gold
          description: "Aggregate silver to daily revenue metrics"
          depends_on:
            - task_key: transform_silver
          notebook_task:
            notebook_path: ../src/gold_aggregates.py
            base_parameters:
              catalog:     ${var.catalog}
              schema:      ${var.schema}
              environment: ${bundle.target}
          timeout_seconds: 900

      # ── Schedule ────────────────────────────────────────────────────────────
      # Both the cron expression and the pause status come from variables,
      # so the schedule is automatically different per target:
      #   dev     → PAUSED  (manual runs only, prevents accidental charges)
      #   staging → UNPAUSED, nightly 3am
      #   prod    → UNPAUSED, nightly 1am

      schedule:
        quartz_cron_expression: ${var.schedule_cron}
        timezone_id: America/Los_Angeles
        pause_status: ${var.schedule_pause_status}

      # ── Notifications ───────────────────────────────────────────────────────
      # Base notification for all targets.
      # Staging and prod override this in databricks.yml under
      #   targets.<name>.resources.jobs.ecommerce_medallion_pipeline

      email_notifications:
        on_failure:
          - data-team@company.com

      # ── Permissions ────────────────────────────────────────────────────────
      # Uncomment and update group names once your workspace groups are set up.
      # permissions:
      #   - level: CAN_MANAGE_RUN
      #     group_name: data-engineers
      #   - level: CAN_VIEW
      #     group_name: data-analysts

      # ── Queue and concurrency ───────────────────────────────────────────────
      queue:
        enabled: true          # queue runs instead of skipping concurrent triggers

      max_concurrent_runs: 1   # prevent overlapping pipeline runs
