# =============================================================================
# Databricks Asset Bundle — Day 31: E-Commerce Medallion Pipeline
#
# WORKSPACE: Single workspace used for all three environments.
# Environments are isolated by SCHEMA NAME within the same catalog.
#
#   dev     → schema: ecommerce_dev     (personal prefix via mode: development)
#   staging → schema: ecommerce_staging
#   prod    → schema: ecommerce_prod
#
# COMPUTE: Serverless (no cluster config needed — workspace enforces serverless)
#
# QUICK START:
#   1. Install Databricks CLI:  pip install databricks-cli
#   2. Authenticate:            databricks configure
#      (enter host: https://dbc-88198f4a-22a1.cloud.databricks.com + your token)
#   3. Set your catalog name in the 'catalog' variable default below
#   4. Validate:   databricks bundle validate
#   5. Deploy dev: databricks bundle deploy
#   6. Run:        databricks bundle run ecommerce_medallion_pipeline
# =============================================================================

bundle:
  name: day31-ecommerce-pipeline

# Pull resource definitions from separate files
include:
  - resources/jobs.yml
  - resources/pipelines.yml

# ---------------------------------------------------------------------------
# Variables
# Declare once here; override per target below.
# Reference anywhere in resource YAML with ${var.variable_name}.
# ---------------------------------------------------------------------------
variables:

  catalog:
    description: "Unity Catalog catalog name. Replace 'main' with your actual catalog."
    default: databricks_pro

  schema:
    description: "Schema for this environment's tables. Overridden per target."
    default: ecommerce_dev

  schedule_cron:
    description: >
      Quartz CRON for the daily pipeline run.
      Format: seconds minutes hours day month weekday
      '0 0 1 * * ?'    → every day at 1am
      '0 0 */6 * * ?'  → every 6 hours
    default: "0 0 */6 * * ?"

  schedule_pause_status:
    description: "PAUSED or UNPAUSED. Dev defaults to PAUSED (manual runs only)."
    default: PAUSED

  dlt_channel:
    description: "DLT release channel: CURRENT or PREVIEW"
    default: CURRENT

# ---------------------------------------------------------------------------
# Targets — all three point to the SAME workspace.
# Environment isolation is achieved through different schema names.
#
# dev     → mode: development adds "[dev <your-username>]" prefix to all
#           resource names so your deployment never collides with colleagues.
#           Data lands in: <catalog>.ecommerce_dev
#
# staging → no prefix, but uses a separate schema.
#           Mirrors prod config to catch issues before they reach prod.
#           Data lands in: <catalog>.ecommerce_staging
#
# prod    → live schedule enabled. In a real org this would point to a
#           separate workspace and use a service principal (run_as).
#           Data lands in: <catalog>.ecommerce_prod
# ---------------------------------------------------------------------------
targets:

  # ── DEV ────────────────────────────────────────────────────────────────────
  dev:
    mode: development   # resource names become: "[dev <username>] ecommerce-medallion-dev"
    default: true       # used when --target flag is omitted
    workspace:
      host: https://dbc-88198f4a-22a1.cloud.databricks.com
    variables:
      catalog:               databricks_pro    # ← same catalog as staging/prod
      schema:                ecommerce_dev     # isolated schema for dev
      schedule_cron:         "0 0 */6 * * ?"
      schedule_pause_status: PAUSED            # manual runs only in dev
      dlt_channel:           CURRENT

  # ── STAGING ────────────────────────────────────────────────────────────────
  staging:
    workspace:
      host: https://dbc-88198f4a-22a1.cloud.databricks.com
    variables:
      catalog:               databricks_pro
      schema:                ecommerce_staging  # isolated schema for staging
      schedule_cron:         "0 0 3 * * ?"      # nightly at 3am
      schedule_pause_status: UNPAUSED
      dlt_channel:           CURRENT
    # Target-level override: staging gets its own failure notification
    resources:
      jobs:
        ecommerce_medallion_pipeline:
          email_notifications:
            on_failure:
              - staging-alerts@company.com

  # ── PROD ───────────────────────────────────────────────────────────────────
  prod:
    workspace:
      host: https://dbc-88198f4a-22a1.cloud.databricks.com
    # Uncomment run_as once you have a service principal configured:
    # run_as:
    #   service_principal_name: "prod-etl-service-principal"
    variables:
      catalog:               databricks_pro
      schema:                ecommerce_prod    # isolated schema for prod
      schedule_cron:         "0 0 1 * * ?"    # nightly at 1am
      schedule_pause_status: UNPAUSED
      dlt_channel:           CURRENT
    # Target-level overrides: prod adds a health check and extra contacts
    resources:
      jobs:
        ecommerce_medallion_pipeline:
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 3600    # alert if pipeline takes > 1 hour
          email_notifications:
            on_failure:
              - data-oncall@company.com
